<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publishing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
  <style>html, body { margin: 0; background: #f8fafc; } svg { width: 1100px; height: 420px; display: block; }</style>
</head>
<body>
<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Publishing</title>
  <desc id="d">An administrator uploads to quarantine. Ingestion prepares the version. A second person publishes it. The uploader cannot approve their own file.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <style>
      .nm { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .sb { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #64748b; text-anchor: middle; }
      .hd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.14em; fill: #c2410c; }
      .lg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="420" fill="#f8fafc"/>

  <rect x="28" y="28" width="700" height="250" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="48" y="52" class="hd">PUBLISHING · INTERNAL</text>

  <rect x="48" y="72" width="300" height="80" rx="6" fill="#ffffff" stroke="rgba(30,41,59,0.25)"/>
  <text x="198" y="104" class="nm">admin-portal</text>
  <text x="198" y="122" class="sb">workforce SSO</text>
  <text x="198" y="138" class="sb">review the warnings</text>

  <rect x="388" y="72" width="312" height="80" rx="6" fill="#ffffff" stroke="rgba(30,41,59,0.25)"/>
  <text x="544" y="104" class="nm">upload-service</text>
  <text x="544" y="122" class="sb">resumable multipart</text>
  <text x="544" y="138" class="sb">straight to quarantine</text>

  <rect x="48" y="176" width="652" height="76" rx="6" fill="#ffffff" stroke="rgba(30,41,59,0.25)"/>
  <text x="374" y="206" class="nm">Second person publishes</text>
  <text x="374" y="224" class="sb">the uploader cannot approve the same version</text>

  <rect x="780" y="72" width="292" height="184" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="926" y="110" class="nm">Ingestion</text>
  <text x="926" y="132" class="sb">outside this component</text>
  <text x="926" y="156" class="sb">scan · sanitise · linearise</text>
  <text x="926" y="176" class="sb">then ready for review</text>
  <text x="926" y="210" class="sb">does not go live here</text>

  <line x1="728" y1="164" x2="780" y2="164" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="28" y="340" class="lg">Upload starts the workflow. Publish is a separate person, after the version is ready.</text>
  <text x="28" y="364" class="lg">Customers keep reading the previous version until they next open the document.</text>
</svg>
</body>
</html>
