<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document API</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
  <style>html, body { margin: 0; background: #f8fafc; } svg { width: 1100px; height: 480px; display: block; }</style>
</head>
<body>
<svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Document API</title>
  <desc id="d">The Document API checks entitlement, issues one cookie for one version, and answers search and reading state. It does not serve PDF bytes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <style>
      .nm { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .sb { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; fill: #64748b; text-anchor: middle; }
      .hd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.14em; fill: #4338ca; }
      .lg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; fill: #64748b; }
    </style>
  </defs>
  <rect width="1100" height="480" fill="#f8fafc"/>

  <rect x="370" y="16" width="360" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="550" y="38" class="nm">Clients</text>
  <text x="550" y="54" class="sb">desktop · iOS · Android</text>
  <line x1="550" y1="68" x2="550" y2="96" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="28" y="104" width="1044" height="220" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="48" y="128" class="hd">DOCUMENT API · WHO MAY READ</text>

  <rect x="48" y="148" width="190" height="72" rx="6" fill="#ffffff" stroke="rgba(30,41,59,0.25)"/>
  <text x="143" y="176" class="nm">document-service</text>
  <text x="143" y="194" class="sb">current version</text>

  <rect x="254" y="148" width="190" height="72" rx="6" fill="#ffffff" stroke="rgba(30,41,59,0.25)"/>
  <text x="349" y="176" class="nm">access-service</text>
  <text x="349" y="194" class="sb">one cookie, one version</text>

  <rect x="460" y="148" width="190" height="72" rx="6" fill="#ffffff" stroke="rgba(30,41,59,0.25)"/>
  <text x="555" y="176" class="nm">search-service</text>
  <text x="555" y="194" class="sb">page, label, snippet</text>

  <rect x="666" y="148" width="190" height="72" rx="6" fill="#ffffff" stroke="rgba(30,41,59,0.25)"/>
  <text x="761" y="176" class="nm">reading-state</text>
  <text x="761" y="194" class="sb">last page · bookmarks</text>

  <rect x="872" y="148" width="176" height="72" rx="6" fill="#ffffff" stroke="rgba(30,41,59,0.25)"/>
  <text x="960" y="176" class="nm">audit-service</text>
  <text x="960" y="194" class="sb">after the read</text>

  <text x="550" y="268" class="sb">A cookie is issued only after the entitlement check. PDF bytes are not on this path.</text>

  <rect x="180" y="360" width="320" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="340" y="384" class="nm">Edge delivery</text>
  <text x="340" y="400" class="sb">outside · serves the bytes</text>

  <rect x="600" y="360" width="320" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="760" y="384" class="nm">Document data</text>
  <text x="760" y="400" class="sb">outside · versions and page text</text>

  <line x1="349" y1="324" x2="340" y2="360" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="555" y1="324" x2="760" y2="360" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="28" y="456" class="lg">The API decides who may read. It does not assemble a PDF.</text>
</svg>
</body>
</html>
