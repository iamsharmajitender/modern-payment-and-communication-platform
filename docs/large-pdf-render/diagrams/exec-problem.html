<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Large PDF Delivery — The problem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8fafc; }
    svg { display: block; width: 1080px; height: 460px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1080 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exec-problem-title exec-problem-desc">
    <title id="exec-problem-title">The whole file moves before anyone can read</title>
    <desc id="exec-problem-desc">Desktop, mobile and publishing each move the whole PDF. Search runs on the device, a new version overwrites the last one, and there is no record of which version a customer saw.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
      </marker>
    </defs>
    <style>
      .card { fill: #ffffff; stroke: rgba(30,41,59,0.22); stroke-width: 1; }
      .desk { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
      .mob { fill: #ffedd5; stroke: #c2410c; stroke-width: 1.4; }
      .pub { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.4; }
      .dup { fill: #fee2e2; stroke: #e11d48; stroke-width: 1.4; }
      .name { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .foot { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #be123c; text-anchor: middle; }
    </style>
    <rect width="100%" height="100%" fill="#f8fafc"/>

    <line x1="196" y1="76" x2="196" y2="92" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="196" y1="152" x2="196" y2="168" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="196" y1="228" x2="196" y2="244" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="196" y1="332" x2="196" y2="348" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="540" y1="76" x2="540" y2="92" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="540" y1="152" x2="540" y2="168" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="540" y1="228" x2="540" y2="244" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="540" y1="332" x2="540" y2="348" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="884" y1="76" x2="884" y2="92" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="884" y1="152" x2="884" y2="168" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="884" y1="228" x2="884" y2="244" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="884" y1="332" x2="884" y2="348" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="36" y="20" width="320" height="48" rx="8" class="desk"/>
    <text x="196" y="50" class="name">Desktop</text>
    <rect x="36" y="96" width="320" height="48" rx="8" class="card"/>
    <text x="196" y="126" class="name">Download the whole file</text>
    <rect x="36" y="172" width="320" height="48" rx="8" class="card"/>
    <text x="196" y="202" class="name">Search on the device</text>
    <rect x="36" y="248" width="320" height="76" rx="8" class="dup"/>
    <text x="196" y="278" class="name">No record of the version</text>
    <text x="196" y="300" class="sub">Overwrite loses the text they saw</text>
    <rect x="36" y="352" width="320" height="48" rx="8" class="card"/>
    <text x="196" y="382" class="name">Readers give up</text>

    <rect x="380" y="20" width="320" height="48" rx="8" class="mob"/>
    <text x="540" y="50" class="name">Mobile</text>
    <rect x="380" y="96" width="320" height="48" rx="8" class="card"/>
    <text x="540" y="126" class="name">Download the whole file</text>
    <rect x="380" y="172" width="320" height="48" rx="8" class="card"/>
    <text x="540" y="202" class="name">Hold it in memory</text>
    <rect x="380" y="248" width="320" height="76" rx="8" class="dup"/>
    <text x="540" y="278" class="name">No record of the version</text>
    <text x="540" y="300" class="sub">Overwrite loses the text they saw</text>
    <rect x="380" y="352" width="320" height="48" rx="8" class="card"/>
    <text x="540" y="382" class="name">The app crashes</text>

    <rect x="724" y="20" width="320" height="48" rx="8" class="pub"/>
    <text x="884" y="50" class="name">Publishing</text>
    <rect x="724" y="96" width="320" height="48" rx="8" class="card"/>
    <text x="884" y="126" class="name">Replace the same file</text>
    <rect x="724" y="172" width="320" height="48" rx="8" class="card"/>
    <text x="884" y="202" class="name">No second approver</text>
    <rect x="724" y="248" width="320" height="76" rx="8" class="dup"/>
    <text x="884" y="278" class="name">No record of the version</text>
    <text x="884" y="300" class="sub">Overwrite loses the text they saw</text>
    <rect x="724" y="352" width="320" height="48" rx="8" class="card"/>
    <text x="884" y="382" class="name">A mix of old and new</text>

    <text x="540" y="432" class="foot">The whole file moves on every open, and nothing records which version the customer saw</text>
  </svg>
</body>
</html>
