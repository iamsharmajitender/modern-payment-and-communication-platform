<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Large PDF Delivery — Business Value Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f8fafc; --color-ink: #1e293b; --color-muted: #64748b;
      --color-rule: rgba(30,41,59,0.12); --color-accent: #3b82f6;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); padding: 3rem 2rem; }
    .frame { max-width: 1320px; margin: 0 auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.5rem; }
    .subtitle { color: var(--color-muted); font-size: 0.95rem; margin-bottom: 1.5rem; max-width: 60rem; }
    .diagram { overflow-x: auto; }
    svg { width: 100%; min-width: 1100px; display: block; }
    footer { margin-top: 2rem; padding-top: 0.75rem; border-top: 1px solid var(--color-rule); font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-muted); letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Business use case · Value map</p>
    <h1>Large PDF delivery: why now, what we build, what we get</h1>
    <p class="subtitle">Why the full-file download has to stop, what the platform is, what the organisation gets, and how it is measured. Value is released in three phases.</p>

    <div class="diagram">
    <svg viewBox="0 0 1280 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pdf-value-title pdf-value-desc">
      <title id="pdf-value-title">Large PDF delivery business value map</title>
      <desc id="pdf-value-desc">Business value map for large PDF delivery. Customers expecting an immediate first page, phones that cannot hold a 200 MB file, search that downloads the document, rising delivery cost, and no proof of the version lead to one Document API, edge delivery of only the bytes on screen, and a pipeline that prepares each version once. Benefits are measured by time to first page, crash rate, bytes per session and an audit of who saw which version, released in three phases from desktop to mobile to hardening.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
        <style>
          .zone       { fill: #f1f5f9; stroke: rgba(30,41,59,0.12); stroke-width: 1; }
          .zone-phase { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.2; }
          .zone-why   { fill: #fff1f2; stroke: #fb7185; stroke-width: 1.2; }
          .zone-focal { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
          .zone-get   { fill: #d1fae5; stroke: #059669; stroke-width: 1.2; }
          .zone-measure { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.2; }
          .chip       { fill: #ffffff; stroke: rgba(30,41,59,0.25); stroke-width: 1; }
          .chip-why   { fill: #ffffff; stroke: #fb7185; stroke-width: 1.2; }
          .chip-build { fill: #ffffff; stroke: #3b82f6; stroke-width: 1.2; }
          .chip-get   { fill: #ffffff; stroke: #34d399; stroke-width: 1.2; }
          .chip-measure { fill: #ffffff; stroke: #fb923c; stroke-width: 1.2; }
          .hd-get { fill: #047857; }
          .hd-why { fill: #be123c; }
          .hd-measure { fill: #c2410c; }
          .nm  { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
          .nml { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: start; }
          .sb  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; fill: #64748b; text-anchor: middle; }
          .sbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; fill: #64748b; text-anchor: start; }
          .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.14em; fill: #94a3b8; text-anchor: start; }
          .hd  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.14em; fill: #1e293b; }
          .hd-focal { fill: #3b82f6; }
          .ix  { fill: #94a3b8; }
          .al  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #64748b; text-anchor: middle; }
          .lg  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #64748b; }
        </style>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafc"/>

      <path d="M276,262 H340" fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="290" y="242" width="36" height="12" rx="2" fill="#f8fafc"/>
      <text x="308" y="251" class="al">SHAPE</text>

      <path d="M604,262 H668" fill="none" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="612" y="242" width="48" height="12" rx="2" fill="#f8fafc"/>
      <text x="636" y="251" class="al">DELIVER</text>

      <line x1="940" y1="100" x2="1004" y2="100" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <line x1="940" y1="168" x2="1004" y2="168" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <line x1="940" y1="236" x2="1004" y2="236" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <line x1="940" y1="304" x2="1004" y2="304" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <line x1="940" y1="372" x2="1004" y2="372" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <line x1="940" y1="440" x2="1004" y2="440" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

      <line x1="424" y1="560" x2="440" y2="560" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="808" y1="560" x2="824" y2="560" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

      <rect x="40" y="40" width="236" height="444" rx="8" class="zone-why"/>
      <text x="56" y="58" class="hd hd-why"><tspan class="ix">01 · </tspan>WHY NOW</text>
      <rect x="52" y="72"  width="212" height="56" rx="6" class="chip-why"/>
      <text x="158" y="96"  class="nm">First page, immediately</text>
      <text x="158" y="112" class="sb">a download feels broken</text>
      <rect x="52" y="140" width="212" height="56" rx="6" class="chip-why"/>
      <text x="158" y="164" class="nm">Phones cannot hold 200 MB</text>
      <text x="158" y="180" class="sb">the app crashes</text>
      <rect x="52" y="208" width="212" height="56" rx="6" class="chip-why"/>
      <text x="158" y="232" class="nm">Search downloads the file</text>
      <text x="158" y="248" class="sb">the viewer reads every page</text>
      <rect x="52" y="276" width="212" height="56" rx="6" class="chip-why"/>
      <text x="158" y="300" class="nm">Cost grows with readers</text>
      <text x="158" y="316" class="sb">bytes nobody displays</text>
      <rect x="52" y="344" width="212" height="56" rx="6" class="chip-why"/>
      <text x="158" y="368" class="nm">No proof of the version</text>
      <text x="158" y="384" class="sb">overwrite loses the record</text>
      <rect x="52" y="412" width="212" height="56" rx="6" class="chip-why"/>
      <text x="158" y="436" class="nm">Unsafe and unscanned files</text>
      <text x="158" y="452" class="sb">no text layer for a scan</text>

      <rect x="340" y="40" width="264" height="444" rx="8" class="zone-focal"/>
      <text x="356" y="58" class="hd hd-focal"><tspan class="ix">02 · </tspan>WHAT WE BUILD</text>
      <rect x="352" y="72"  width="240" height="56" rx="6" class="chip-build"/>
      <text x="472" y="96"  class="nm">Document API</text>
      <text x="472" y="112" class="sb">one check for who may read</text>
      <rect x="352" y="140" width="240" height="56" rx="6" class="chip-build"/>
      <text x="472" y="164" class="nm">Edge delivery</text>
      <text x="472" y="180" class="sb">only the bytes on screen</text>
      <rect x="352" y="208" width="240" height="56" rx="6" class="chip-build"/>
      <text x="472" y="232" class="nm">Page chunks for phones</text>
      <text x="472" y="248" class="sb">native viewers, low memory</text>
      <rect x="352" y="276" width="240" height="56" rx="6" class="chip-build"/>
      <text x="472" y="300" class="nm">Search and outline, once</text>
      <text x="472" y="316" class="sb">built when the version is published</text>
      <rect x="352" y="344" width="240" height="56" rx="6" class="chip-build"/>
      <text x="472" y="368" class="nm">Immutable versions</text>
      <text x="472" y="384" class="sb">new keys, previous one stays</text>
      <rect x="352" y="412" width="240" height="56" rx="6" class="chip-build"/>
      <text x="472" y="436" class="nm">Scan, then a second person</text>
      <text x="472" y="452" class="sb">linearise last</text>

      <rect x="668" y="40" width="272" height="444" rx="8" class="zone-get"/>
      <text x="684" y="58" class="hd hd-get"><tspan class="ix">03 · </tspan>WHAT WE GET</text>
      <rect x="680" y="72"  width="248" height="56" rx="6" class="chip-get"/>
      <text x="692" y="94"  class="tag">CUSTOMER</text>
      <text x="692" y="114" class="nml">First page in about two seconds</text>
      <rect x="680" y="140" width="248" height="56" rx="6" class="chip-get"/>
      <text x="692" y="162" class="tag">CUSTOMER</text>
      <text x="692" y="182" class="nml">A phone that stays up</text>
      <rect x="680" y="208" width="248" height="56" rx="6" class="chip-get"/>
      <text x="692" y="230" class="tag">COST</text>
      <text x="692" y="250" class="nml">A few megabytes per session</text>
      <rect x="680" y="276" width="248" height="56" rx="6" class="chip-get"/>
      <text x="692" y="298" class="tag">SUPPORT</text>
      <text x="692" y="318" class="nml">Fewer calls about the document</text>
      <rect x="680" y="344" width="248" height="56" rx="6" class="chip-get"/>
      <text x="692" y="366" class="tag">COMPLIANCE</text>
      <text x="692" y="386" class="nml">Proof of the version they saw</text>
      <rect x="680" y="412" width="248" height="56" rx="6" class="chip-get"/>
      <text x="692" y="434" class="tag">INCLUSION · RISK</text>
      <text x="692" y="454" class="nml">A text layer, no active content</text>

      <rect x="1004" y="40" width="236" height="444" rx="8" class="zone-measure"/>
      <text x="1020" y="58" class="hd hd-measure"><tspan class="ix">04 · </tspan>HOW WE MEASURE</text>
      <rect x="1016" y="72"  width="212" height="56" rx="6" class="chip-measure"/>
      <text x="1028" y="96"  class="nml">Under 2 seconds to page 1</text>
      <text x="1028" y="112" class="sbl">under 3 seconds on 4G</text>
      <rect x="1016" y="140" width="212" height="56" rx="6" class="chip-measure"/>
      <text x="1028" y="164" class="nml">No out-of-memory crashes</text>
      <text x="1028" y="180" class="sbl">reference low-end phone</text>
      <rect x="1016" y="208" width="212" height="56" rx="6" class="chip-measure"/>
      <text x="1028" y="232" class="nml">Under 10% of the file</text>
      <text x="1028" y="248" class="sbl">bytes per session</text>
      <rect x="1016" y="276" width="212" height="56" rx="6" class="chip-measure"/>
      <text x="1028" y="300" class="nml">Search under 500 ms</text>
      <text x="1028" y="316" class="sbl">page number and snippet</text>
      <rect x="1016" y="344" width="212" height="56" rx="6" class="chip-measure"/>
      <text x="1028" y="368" class="nml">Audit from the records</text>
      <text x="1028" y="384" class="sbl">who opened which version</text>
      <rect x="1016" y="412" width="212" height="56" rx="6" class="chip-measure"/>
      <text x="1028" y="436" class="nml">WCAG 2.2 AA</text>
      <text x="1028" y="452" class="sbl">zero unsafe files published</text>

      <rect x="40" y="508" width="1200" height="84" rx="8" class="zone-phase"/>
      <text x="56" y="526" class="hd"><tspan class="ix">05 · </tspan>VALUE RELEASED IN PHASES</text>
      <rect x="56"  y="540" width="368" height="40" rx="6" class="chip-build"/>
      <text x="240" y="557" class="nm">1 · Desktop</text>
      <text x="240" y="571" class="sb">reading, search, and most of the cost saving</text>
      <rect x="440" y="540" width="368" height="40" rx="6" class="chip-get"/>
      <text x="624" y="557" class="nm">2 · Mobile</text>
      <text x="624" y="571" class="sb">page chunks · no crashes on a phone</text>
      <rect x="824" y="540" width="368" height="40" rx="6" class="chip-measure"/>
      <text x="1008" y="557" class="nm">3 · Hardening</text>
      <text x="1008" y="571" class="sb">OCR · offline copy · bookmarks that follow</text>

      <line x1="40" y1="616" x2="1240" y2="616" stroke="rgba(30,41,59,0.10)" stroke-width="0.8"/>
      <text x="40" y="640" class="lg" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="628" width="24" height="16" rx="4" fill="#fff1f2" stroke="#fb7185" stroke-width="1.2"/>
      <text x="152" y="640" class="lg">Why now</text>
      <rect x="250" y="628" width="24" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
      <text x="282" y="640" class="lg">What we build</text>
      <rect x="400" y="628" width="24" height="16" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
      <text x="432" y="640" class="lg">What we get</text>
      <rect x="540" y="628" width="24" height="16" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
      <text x="572" y="640" class="lg">How we measure</text>
      <line x1="760" y1="636" x2="792" y2="636" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="800" y="640" class="lg">Leads to</text>
      <line x1="900" y1="636" x2="932" y2="636" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text x="940" y="640" class="lg">Benefit measured by</text>
    </svg>
    </div>

    <footer>Large PDF delivery · Business use case · G.A.I.N diagram skin</footer>
  </div>
</body>
</html>
