<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer communication — the solution</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8fafc; }
    svg { display: block; width: 1080px; height: 400px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1080 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
    <title id="t">One notification front door, one notification core brain, one adapter per channel</title>
    <desc id="d">Producers call one notification front door, which holds ingestion, outbox and release. The notification core brain holds the dispatcher, recipient resolution and template resolution. Individual channel adapters submit to the external channel providers, which deliver to the customer.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
      </marker>
    </defs>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .api { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .orch { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.5; }
      .ch { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
      .ext { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 1.4; }
      .name { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .foot { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: #64748b; text-anchor: middle; }
    </style>
    <rect width="100%" height="100%" fill="#f8fafc"/>

    <line x1="168" y1="168" x2="196" y2="168" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="344" y1="168" x2="372" y2="168" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="520" y1="168" x2="548" y2="168" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="696" y1="168" x2="724" y2="168" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="872" y1="168" x2="900" y2="168" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="20" y="110" width="148" height="116" rx="8" class="box"/>
    <text x="94" y="162" class="name">Producers</text>
    <text x="94" y="186" class="sub">REST</text>

    <rect x="196" y="110" width="148" height="116" rx="8" class="api"/>
    <text x="270" y="150" class="name">Notification</text>
    <text x="270" y="168" class="name">front door</text>
    <text x="270" y="192" class="sub">Ingestion, outbox, release</text>

    <rect x="372" y="110" width="148" height="116" rx="8" class="orch"/>
    <text x="446" y="150" class="name">Notification</text>
    <text x="446" y="168" class="name">core brain</text>
    <text x="446" y="192" class="sub">Dispatch, recipient, template</text>

    <rect x="548" y="110" width="148" height="116" rx="8" class="ch"/>
    <text x="622" y="150" class="name">Notification</text>
    <text x="622" y="168" class="name">channel adapters</text>
    <text x="622" y="192" class="sub">Email, SMS, push</text>

    <rect x="724" y="110" width="148" height="116" rx="8" class="ext"/>
    <text x="798" y="146" class="name">Notification</text>
    <text x="798" y="164" class="name">external channel</text>
    <text x="798" y="182" class="name">providers</text>
    <text x="798" y="204" class="sub">Email, SMS, push</text>

    <rect x="900" y="110" width="148" height="116" rx="8" class="box"/>
    <text x="974" y="162" class="name">Customer</text>
    <text x="974" y="186" class="sub">Receives the message</text>

    <text x="540" y="300" class="foot">Immediate and future-dated sends join the same notification core brain.</text>
    <text x="540" y="324" class="foot">The producer is released when the outbox commits, and reads status by tracking id.</text>
  </svg>
</body>
</html>
