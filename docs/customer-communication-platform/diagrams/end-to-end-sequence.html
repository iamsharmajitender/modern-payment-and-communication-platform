<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer communication — end-to-end sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f8fafc; }
    svg { display: block; width: 1040px; height: 1000px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1040 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="e2e-title e2e-desc">
    <title id="e2e-title">End-to-end notification sequence</title>
    <desc id="e2e-desc">Read top to bottom. Producers call the notification front door. The front door publishes notification.ready to Kafka. The notification core brain consumes it, calls recipient resolution and template resolution, then publishes a channel message. The channel adapter consumes that message and calls the external provider, which delivers to the customer. Kafka is the backbone on the right. The front door, the brain and the adapters publish and consume through it.</desc>
    <defs>
      <marker id="solid" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#334155"/>
      </marker>
      <marker id="dot" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
      </marker>
    </defs>
    <style>
      .zone-fd { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2; }
      .zone-br { fill: #fdf2f8; stroke: #f9a8d4; stroke-width: 1.2; }
      .zone-ad { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.2; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .api { fill: #ffffff; stroke: #16a34a; stroke-width: 1.4; }
      .db { fill: #ffffff; stroke: #0f766e; stroke-width: 1.4; }
      .kafka { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.6; }
      .brain { fill: #ffffff; stroke: #db2777; stroke-width: 1.4; }
      .ch { fill: #ffffff; stroke: #ea580c; stroke-width: 1.3; }
      .ext { fill: #ffffff; stroke: #6d28d9; stroke-width: 1.4; }
      .name { font-family: Inter, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .sub { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
      .lane { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #64748b; }
      .kname { font-family: Inter, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #5b21b6; text-anchor: middle; }
      .ksub { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: #6d28d9; text-anchor: middle; }
      .topic { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #5b21b6; text-anchor: middle; }
      .lbl { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .legend { font-family: Inter, system-ui, sans-serif; font-size: 12px; fill: #64748b; }
    </style>
    <rect width="100%" height="100%" fill="#f8fafc"/>

    <!-- zones, then arrows, then labels, then boxes, then Kafka on top -->
    <rect x="16" y="84" width="824" height="300" rx="12" class="zone-fd"/>
    <rect x="16" y="404" width="824" height="276" rx="12" class="zone-br"/>
    <rect x="16" y="700" width="824" height="136" rx="12" class="zone-ad"/>

    <text x="32" y="108" class="lane">Notification front door</text>
    <text x="32" y="428" class="lane">Notification core brain</text>
    <text x="32" y="724" class="lane">Notification channel adapters</text>
    <text x="700" y="716" class="lane" text-anchor="end">Each adapter publishes and consumes</text>

    <!-- boxes -->
    <rect x="196" y="12" width="216" height="56" rx="8" class="box"/>
    <text x="304" y="36" class="name">Producers</text>
    <text x="304" y="54" class="sub">Product systems</text>

    <rect x="196" y="120" width="216" height="72" rx="8" class="api"/>
    <text x="304" y="150" class="name">Ingestion</text>
    <text x="304" y="172" class="sub">REST, returns 202</text>

    <rect x="468" y="116" width="200" height="80" rx="8" class="db"/>
    <text x="568" y="148" class="name">Front door</text>
    <text x="568" y="168" class="name">database</text>
    <text x="568" y="186" class="sub">Source of truth</text>

    <rect x="32" y="216" width="280" height="64" rx="8" class="api"/>
    <text x="172" y="242" class="name">Outbox</text>
    <text x="172" y="262" class="sub">3 claim, then publish</text>

    <rect x="32" y="296" width="280" height="64" rx="8" class="api"/>
    <text x="172" y="322" class="name">Release</text>
    <text x="172" y="342" class="sub">3a due rows, then publish</text>

    <rect x="32" y="440" width="200" height="88" rx="8" class="brain"/>
    <text x="132" y="474" class="name">Recipient</text>
    <text x="132" y="494" class="name">resolution</text>
    <text x="132" y="514" class="sub">Addresses</text>

    <rect x="252" y="440" width="200" height="88" rx="8" class="brain"/>
    <text x="352" y="474" class="name">Template</text>
    <text x="352" y="494" class="name">resolution</text>
    <text x="352" y="514" class="sub">Approved content</text>

    <rect x="32" y="560" width="480" height="96" rx="8" class="brain"/>
    <text x="272" y="596" class="name">Core dispatcher</text>
    <text x="272" y="618" class="sub">8–9 channel outbox</text>
    <text x="272" y="636" class="sub">15 calls the front door</text>

    <rect x="32" y="736" width="160" height="72" rx="8" class="ch"/>
    <text x="112" y="766" class="name">Email</text>
    <text x="112" y="786" class="sub">adapter</text>
    <rect x="208" y="736" width="160" height="72" rx="8" class="ch"/>
    <text x="288" y="766" class="name">SMS</text>
    <text x="288" y="786" class="sub">adapter</text>
    <rect x="384" y="736" width="160" height="72" rx="8" class="ch"/>
    <text x="464" y="766" class="name">Push</text>
    <text x="464" y="786" class="sub">adapter</text>
    <rect x="560" y="736" width="160" height="72" rx="8" class="ch"/>
    <text x="640" y="766" class="name">Physical</text>
    <text x="640" y="786" class="sub">adapter</text>

    <rect x="256" y="856" width="240" height="72" rx="8" class="ext"/>
    <text x="376" y="884" class="name">External providers</text>
    <text x="376" y="906" class="sub">Email, SMS, push, print</text>

    <rect x="552" y="856" width="176" height="72" rx="8" class="box"/>
    <text x="640" y="888" class="name">Customer</text>
    <text x="640" y="908" class="sub">The message</text>

    <!-- synchronous -->
    <line x1="304" y1="68" x2="304" y2="120" stroke="#334155" stroke-width="1.4" marker-end="url(#solid)"/>
    <line x1="412" y1="156" x2="468" y2="156" stroke="#334155" stroke-width="1.4" marker-end="url(#solid)"/>
    <line x1="132" y1="560" x2="132" y2="528" stroke="#334155" stroke-width="1.4" marker-end="url(#solid)"/>
    <line x1="352" y1="560" x2="352" y2="528" stroke="#334155" stroke-width="1.4" marker-end="url(#solid)"/>
    <path d="M32 820 H720" fill="none" stroke="#334155" stroke-width="1.4"/>
    <line x1="376" y1="820" x2="376" y2="856" stroke="#334155" stroke-width="1.4" marker-end="url(#solid)"/>
    <line x1="496" y1="892" x2="552" y2="892" stroke="#334155" stroke-width="1.4" marker-end="url(#solid)"/>

    <!-- Kafka hops. Each one is its own horizontal line. -->
    <line x1="312" y1="248" x2="864" y2="248" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dot)"/>
    <line x1="312" y1="328" x2="864" y2="328" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dot)"/>
    <line x1="864" y1="584" x2="512" y2="584" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dot)"/>
    <line x1="512" y1="616" x2="864" y2="616" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dot)"/>
    <line x1="864" y1="648" x2="512" y2="648" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dot)"/>
    <line x1="864" y1="752" x2="720" y2="752" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dot)"/>
    <line x1="720" y1="792" x2="864" y2="792" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dot)"/>

    <rect x="316" y="80" width="56" height="16" rx="2" fill="#f8fafc"/>
    <text x="344" y="92" class="lbl">1 REST</text>
    <rect x="420" y="132" width="40" height="16" rx="2" fill="#f0fdf4"/>
    <text x="440" y="144" class="lbl">2</text>
    <rect x="140" y="532" width="16" height="16" rx="2" fill="#fdf2f8"/>
    <text x="148" y="544" class="lbl">6</text>
    <rect x="360" y="532" width="16" height="16" rx="2" fill="#fdf2f8"/>
    <text x="368" y="544" class="lbl">7</text>
    <rect x="388" y="828" width="72" height="16" rx="2" fill="#fff7ed"/>
    <text x="424" y="840" class="lbl">12 submit</text>
    <rect x="500" y="868" width="48" height="16" rx="2" fill="#f8fafc"/>
    <text x="524" y="880" class="lbl">13</text>
    <rect x="520" y="224" width="64" height="16" rx="2" fill="#f0fdf4"/>
    <text x="552" y="236" class="lbl">4 ready</text>
    <rect x="496" y="304" width="96" height="16" rx="2" fill="#f0fdf4"/>
    <text x="544" y="316" class="lbl">4a scheduled</text>
    <rect x="640" y="560" width="64" height="16" rx="2" fill="#fdf2f8"/>
    <text x="672" y="572" class="lbl">5 ready</text>
    <rect x="628" y="592" width="88" height="16" rx="2" fill="#fdf2f8"/>
    <text x="672" y="604" class="lbl">10 channel</text>
    <rect x="632" y="624" width="80" height="16" rx="2" fill="#fdf2f8"/>
    <text x="672" y="636" class="lbl">15 result</text>
    <rect x="748" y="728" width="80" height="16" rx="2" fill="#fff7ed"/>
    <text x="788" y="740" class="lbl">11 channel</text>
    <rect x="752" y="768" width="72" height="16" rx="2" fill="#fff7ed"/>
    <text x="788" y="780" class="lbl">14 result</text>

    <!-- Kafka backbone -->
    <rect x="864" y="84" width="160" height="752" rx="12" class="kafka"/>
    <text x="944" y="420" class="kname">Kafka</text>
    <text x="944" y="444" class="ksub">Event backbone</text>
    <text x="944" y="480" class="topic">notification.ready</text>
    <text x="944" y="504" class="topic">notification.channel</text>
    <text x="944" y="528" class="topic">notification.result</text>

    <line x1="32" y1="952" x2="1008" y2="952" stroke="rgba(30,41,59,0.12)" stroke-width="1"/>
    <line x1="32" y1="972" x2="64" y2="972" stroke="#334155" stroke-width="1.4" marker-end="url(#solid)"/>
    <text x="72" y="976" class="legend">Call or database write</text>
    <line x1="280" y1="972" x2="312" y2="972" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dot)"/>
    <text x="320" y="976" class="legend">Kafka. Front door, brain and adapters all use it.</text>
  </svg>
</body>
</html>
